services:
  postgis:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        PGVECTOR_VERSION: "0.8.7"
    image: agenticdb-sj-postgis-pgvector:16-3.5-0.8.7
    container_name: agenticdb_sj_postgis
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - agenticdb_sj_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  agenticdb_sj_pgdata:
